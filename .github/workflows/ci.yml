name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR makes the older run obsolete: cancel it. Runs on main each get their own group
# (run id), so no main run is ever cancelled or replaced.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run check
      - name: Validate owner daily-live release and hosting policy
        run: node scripts/validate-hosting-release.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Test daily checked promotion, one-day atomic marker and recovery schedules
        run: node --test scripts/promote-live.test.mjs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
      # This is the pinned upstream runner executed against the ACTUAL Stripe
      # RTC HTTP service + disposable PostgreSQL, not just Hub's fake server.
      # Full/write probes remain out-of-subset and are never certified.
      - uses: actions/checkout@v4
        with:
          repository: Robinson-AI-Systems/robinsons-toolkit-hub
          ref: f8e61dbca058c29ded572a660082429d5a3e6641
          path: rtc-reference
      - run: node scripts/rtc-service-subset.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres
      # Hub K-3 private candidate: immutable Git source and separately pinned
      # actual archive SHA256, installed ONLY inside disposable CI checkout.
      # No runtime dependency, publication, release or Production build.
      - uses: actions/checkout@v4
        with:
          repository: Robinson-AI-Systems/robinsons-toolkit-hub
          ref: 08f4189f72dbe1d5b870c7b17daabd39833eff31
          path: k3-candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: k3-candidate
      - name: Prove original Stripe imports/SQL through checksum-verified private core
        run: node scripts/k3-private-adoption-rehearsal.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-not-a-secret@127.0.0.1:5432/postgres

  mock:
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripe/stripe-mock:v0.202.0
        ports: ['12111:12111']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run test:mock
        env:
          STRIPE_MOCK_EXTERNAL: '1'

  rtc-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Robinson-AI-Systems/robinsons-toolkit-hub
          ref: f8e61dbca058c29ded572a660082429d5a3e6641
          path: rtc-reference
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rtc-reference/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
        working-directory: rtc-reference
      - run: npm run test:conformance
        working-directory: rtc-reference
  ci:
    if: always()
    needs: [check, unit, db, mock, rtc-reference]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job
        env:
          CHECK: ${{ needs.check.result }}
          UNIT: ${{ needs.unit.result }}
          DB: ${{ needs.db.result }}
          MOCK: ${{ needs.mock.result }}
          RTC: ${{ needs.rtc-reference.result }}
        run: |
          test "$CHECK" = success
          test "$UNIT" = success
          test "$DB" = success
          test "$MOCK" = success
          test "$RTC" = success
