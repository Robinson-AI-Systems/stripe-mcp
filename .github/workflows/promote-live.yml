name: Daily live promotion

on:
  # Owner schedule: 00:01 Denver, including DST; GitHub may start late.
  schedule:
    - cron: '1 0 * * *'
      timezone: America/Denver

# The dedicated scheduled job is the sole automated writer for live.
# No manual dispatch, push trigger, force push, Stripe LIVE permission or keys.
permissions:
  contents: write
  checks: read

concurrency:
  group: daily-live-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/promote-live.test.mjs
      - name: Promote exactly one checked main snapshot per Denver day
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/promote-live.mjs
