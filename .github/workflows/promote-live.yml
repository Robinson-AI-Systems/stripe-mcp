name: Daily live promotion

on:
  # Owner schedule: 00:01 Denver, including DST; GitHub may start late.
  schedule:
    # Primary Denver midnight release, with bounded missed-event recovery.
    # The UTC backup also avoids relying exclusively on timezone triggers.
    - cron: '1 0 * * *'
      timezone: America/Denver
    - cron: '17 0 * * *'
      timezone: America/Denver
    - cron: '17 1 * * *'
      timezone: America/Denver
    - cron: '37 5 * * *'
      timezone: America/Denver
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      recover_missed_daily:
        description: 'Owner-only checked recovery of a missed daily release'
        type: boolean
        required: true
        default: false
# All recovery paths share the same checked atomic daily promoter.
permissions:
  contents: write
  checks: read

concurrency:
  group: daily-live-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.recover_missed_daily == true && github.actor == 'christcr2012' && github.triggering_actor == 'christcr2012'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/promote-live.test.mjs
      - name: Promote exactly one checked main snapshot per Denver day
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVER_MISSED_DAILY: ${{ inputs.recover_missed_daily }}
        run: node scripts/promote-live.mjs
