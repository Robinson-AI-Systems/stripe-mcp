name: Daily live promotion

on:
  # Owner schedule: 20:53 Denver, including DST; GitHub may start late.
  schedule:
    # Primary Denver evening release, with bounded missed-event recovery.
    # The UTC backup also avoids relying exclusively on timezone triggers.
    - cron: '53 20 * * *'
      timezone: America/Denver
    - cron: '9 21 * * *'
      timezone: America/Denver
    - cron: '9 22 * * *'
      timezone: America/Denver
    - cron: '29 2 * * *'
      timezone: America/Denver
    - cron: '35 9 * * *'
  workflow_dispatch:
    inputs:
      recover_missed_daily:
        description: 'Owner-only checked recovery of a missed daily release'
        type: boolean
        required: true
        default: false
      owner_release:
        description: 'Owner-only checked release ordered by the owner'
        type: boolean
        required: false
        default: false
      expected_main_sha:
        description: 'Exact 40-character main commit SHA an owner release must match'
        type: string
        required: false
        default: ''
# All recovery and owner-ordered paths share the same checked atomic promoter.
permissions:
  contents: write
  checks: read

concurrency:
  group: daily-live-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.recover_missed_daily == true && github.actor == 'christcr2012' && github.triggering_actor == 'christcr2012') ||
       (github.event_name == 'workflow_dispatch' && inputs.owner_release == true && github.actor == 'christcr2012' && github.triggering_actor == 'christcr2012'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/promote-live.test.mjs
      - name: Promote a checked main snapshot to live
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVER_MISSED_DAILY: ${{ inputs.recover_missed_daily }}
          OWNER_RELEASE: ${{ inputs.owner_release }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: node scripts/promote-live.mjs
